# Builds Clickr for Apple silicon (arm64) and as a universal app (arm64 + x86_64), and
# releases it automatically.
#
# - Every push and pull request runs the CompanionKit tests and builds both variants. The
#   zips are attached to the workflow run as artifacts.
# - On a push to main, if there's no tag yet for the version in project.yml
#   (MARKETING_VERSION), the workflow tags that commit as v<version> and publishes a GitHub
#   release with both zips and their SHA-256 checksums. So to ship a new version, bump
#   MARKETING_VERSION and push. Pushes that don't change the version only build and test.
#
# The builds are ad-hoc signed (no Developer ID), like local builds.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so two quick pushes can't race to make the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and decide whether to release
        id: plan
        run: |
          version="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)"
          if [[ -z "$version" ]]; then
            echo "::error::Couldn't read MARKETING_VERSION from project.yml"
            exit 1
          fi
          release=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "v$version is already tagged; building without releasing."
            else
              echo "v$version isn't tagged yet; this run will release it."
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Run the CompanionKit tests
        working-directory: Packages/CompanionKit
        run: swift test

  build:
    name: Build (${{ matrix.variant }})
    needs: plan
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            archs: arm64
          - variant: universal
            archs: arm64 x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Clickr.xcodeproj \
            -scheme Clickr \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="${{ matrix.archs }}" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ needs.plan.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- \
            | tail -n 40
          exit "${PIPESTATUS[0]}"

      - name: Check the architectures
        run: |
          binary=build/Build/Products/Release/Clickr.app/Contents/MacOS/Clickr
          lipo -info "$binary"
          # -verify_arch takes one architecture per call.
          for arch in ${{ matrix.archs }}; do
            lipo "$binary" -verify_arch "$arch"
          done

      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Clickr.app \
            "Clickr-${{ needs.plan.outputs.version }}-${{ matrix.variant }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Clickr-${{ matrix.variant }}
          path: Clickr-*.zip
          if-no-files-found: error

  release:
    name: Release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add checksums
        working-directory: dist
        run: sha256sum Clickr-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Clickr $VERSION" \
            --generate-notes
