# Builds Clickr for Apple silicon (arm64) and as a universal app (arm64 + x86_64).
#
# - Pushes and pull requests: run the CompanionKit tests and build both variants. The zips
#   are attached to the workflow run as artifacts.
# - Tags like v1.2.3: the same, with the app's version set from the tag, then a draft
#   GitHub release with both zips and their SHA-256 checksums. Publish it by hand when it
#   looks right; drafts don't show up in Clickr's update check.
#
# The builds are ad-hoc signed (no Developer ID), like local builds.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Run the CompanionKit tests
        working-directory: Packages/CompanionKit
        run: swift test

  build:
    name: Build (${{ matrix.variant }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            archs: arm64
          - variant: universal
            archs: arm64 x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)"
          fi
          echo "Building Clickr $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project Clickr.xcodeproj \
            -scheme Clickr \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="${{ matrix.archs }}" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- \
            | tail -n 40
          exit "${PIPESTATUS[0]}"

      - name: Check the architectures
        run: |
          binary=build/Build/Products/Release/Clickr.app/Contents/MacOS/Clickr
          lipo -info "$binary"
          # -verify_arch takes one architecture per call.
          for arch in ${{ matrix.archs }}; do
            lipo "$binary" -verify_arch "$arch"
          done

      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Clickr.app \
            "Clickr-${{ steps.version.outputs.version }}-${{ matrix.variant }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Clickr-${{ matrix.variant }}
          path: Clickr-*.zip
          if-no-files-found: error

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add checksums
        working-directory: dist
        run: sha256sum Clickr-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clickr ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft
