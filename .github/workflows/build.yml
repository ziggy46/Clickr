# Builds Clickr for Apple silicon (arm64) and as a universal app (arm64 + x86_64), and
# releases it automatically.
#
# - Every push and pull request runs the CompanionKit tests and builds both variants. The
#   disk images are attached to the workflow run as artifacts.
# - On a push to main, if there's no tag yet for the version in project.yml
#   (MARKETING_VERSION), the workflow tags that commit as v<version> and publishes a GitHub
#   release with both disk images, their Ed25519 signatures (SIGNATURES.txt) and SHA-256
#   checksums. So to ship a new version, bump MARKETING_VERSION and push. Pushes that don't
#   change the version only build and test.
#
# The builds are ad-hoc signed (no Developer ID), like local builds. Clickr installs an
# update only if its disk image is signed with the key in the UPDATE_SIGNING_KEY secret,
# which matches ClickrUpdatePublicKey in App/Info.plist (see scripts/update-signing.swift).
# Only the release job sees that secret.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so two quick pushes can't race to make the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and decide whether to release
        id: plan
        run: |
          version="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)"
          if [[ -z "$version" ]]; then
            echo "::error::Couldn't read MARKETING_VERSION from project.yml"
            exit 1
          fi
          release=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "v$version is already tagged; building without releasing."
            else
              echo "v$version isn't tagged yet; this run will release it."
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Run the CompanionKit tests
        working-directory: Packages/CompanionKit
        run: swift test

  build:
    name: Build (${{ matrix.variant }})
    needs: plan
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            archs: arm64
          - variant: universal
            archs: arm64 x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Clickr.xcodeproj \
            -scheme Clickr \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="${{ matrix.archs }}" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ needs.plan.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- \
            | tail -n 40
          exit "${PIPESTATUS[0]}"

      - name: Check the architectures
        run: |
          binary=build/Build/Products/Release/Clickr.app/Contents/MacOS/Clickr
          lipo -info "$binary"
          # -verify_arch takes one architecture per call.
          for arch in ${{ matrix.archs }}; do
            lipo "$binary" -verify_arch "$arch"
          done

      - name: Check the signature
        run: codesign --verify --deep --strict build/Build/Products/Release/Clickr.app

      - name: Make the disk image
        run: |
          dmg="Clickr-${{ needs.plan.outputs.version }}-${{ matrix.variant }}.dmg"
          scripts/make-dmg.sh build/Build/Products/Release/Clickr.app "$dmg"
          hdiutil verify "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Clickr-${{ matrix.variant }}
          path: Clickr-*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, test, build]
    # macOS for CryptoKit, which the signing script uses.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sign the disk images
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Fails without the secret, or with a key that doesn't match the app's, so a
          # release can't go out that Clickr would refuse to install.
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :ClickrUpdatePublicKey' App/Info.plist)"
          cd dist
          swift ../scripts/update-signing.swift sign "$public_key" Clickr-*.dmg > SIGNATURES.txt
          cat SIGNATURES.txt

      - name: Add checksums
        working-directory: dist
        run: shasum -a 256 Clickr-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Clickr $VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes
