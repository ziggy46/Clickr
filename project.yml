name: Clickr
options:
  bundleIdPrefix: com.ziggy46
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CompanionKit:
    path: Packages/CompanionKit
targets:
  Clickr:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "AppIcon.icon/**"
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: CompanionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziggy46.clickr
        PRODUCT_NAME: Clickr
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug builds get get-task-allow so the debugger can attach; releases shouldn't.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  Clickr:
    build:
      targets:
        Clickr: all
    run:
      config: Debug
    archive:
      config: Release
